name: Collect LG temperatures
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: read
concurrency:
  group: lg-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run --no-sync collect.py
        env:
          LG_ACCESS_TOKEN: ${{ secrets.LG_ACCESS_TOKEN }}
          LG_COUNTRY: ${{ vars.LG_COUNTRY || 'BR' }}
          LG_REGION: ${{ vars.LG_REGION || 'aic' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WEATHER_LOCATION: ${{ vars.WEATHER_LOCATION }}
          WEATHER_LATITUDE: ${{ vars.WEATHER_LATITUDE }}
          WEATHER_LONGITUDE: ${{ vars.WEATHER_LONGITUDE }}
